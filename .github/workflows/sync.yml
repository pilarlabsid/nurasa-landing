name: Sync to Nurasa Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout source repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Clone destination repo
      env:
        TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        echo "🔍 Cloning nurasa repo..."
        # Kita clone repo private nurasa ke folder 'nurasa-sync'
        git clone "https://x-access-token:${TOKEN}@github.com/pilarlabsid/nurasa.git" nurasa-sync

    - name: Get commit info
      id: commit-info
      run: |
        COMMIT_MSG=$(git log -1 --pretty=format:"%s")
        COMMIT_HASH=$(git log -1 --pretty=format:"%h")
        echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
        echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

    - name: Sync files
      run: |
        echo "🔁 Syncing files..."
        # rsync akan memindahkan semua file dari repo ini ke folder nurasa-sync
        # Kita exclude folder git, github, dan folder hasil build
        rsync -av --delete \
          --exclude '.git/' \
          --exclude '.github/' \
          --exclude 'node_modules/' \
          --exclude 'dist/' \
          ./ nurasa-sync/

    - name: Push changes
      env:
        TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        cd nurasa-sync
        git add .
        
        # Cek jika ada perubahan sebelum commit
        if git diff --staged --quiet; then
          echo "No changes to sync"
        else
          git commit -m "${{ steps.commit-info.outputs.msg }} (sync from ${{ steps.commit-info.outputs.hash }})"
          echo "🚀 Pushing to nurasa repo..."
          git push origin main
          echo "✅ Synced to nurasa repo"
        fi
