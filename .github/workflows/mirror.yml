name: Mirror to Nurasa Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to deploy repo
        env:
          MY_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add deploy https://x-access-token:${MY_TOKEN}@github.com/pilarlabsid/nurasa.git || git remote set-url deploy https://x-access-token:${MY_TOKEN}@github.com/pilarlabsid/nurasa.git
          git push deploy main --force
