  <style>
    /* Critical CSS to prevent white flash and layout shift on initial render */
    :root {
      --warm-cream: #FAF6F1;
      --deep-cocoa: #3D2314;
    }

    body {
      background-color: var(--warm-cream) !important;
      margin: 0;
      overflow-x: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* Reserve space for Hero to prevent CLS */
    #beranda {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background-color: var(--warm-cream);
    }

    .hero-img-container {
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 320px; /* xs */
      background-color: rgba(61, 35, 20, 0.05);
      border-radius: 2.5rem;
      margin: 0 auto;
    }

    @media (min-width: 640px) { .hero-img-container { max-width: 384px; } }
    @media (min-width: 1024px) { .hero-img-container { max-width: 512px; border-radius: 4rem; } }

    /* Prevent mobile hero shift */
    @media (max-width: 1023px) {
      #beranda .flex-col {
        padding-top: 3.5rem;
      }
    }

    /* Lock hero text to left-align on desktop BEFORE Tailwind loads */
    @media (min-width: 1024px) {
      #beranda .hero-text-col {
        align-items: flex-start !important;
        text-align: left !important;
      }
    }
  </style>
</head>
